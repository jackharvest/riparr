# Build the Preparer for macOS, Windows and Linux, and attach the three to a release.
#
# The Preparer is the only piece a person runs on their own computer; the appliance half
# installs itself onto the board. So "an app for every operating system" means this app,
# and the point of building it here rather than asking people to install Python is that
# nobody should need a toolchain to write an SD card.
#
# Each build is packaged the way its own platform expects a program to arrive: a .dmg
# you drag into Applications, a single .exe you double-click, a .tar.gz you unpack.
# Handing somebody a zip of a directory and calling it an app is how this used to work
# and it asked them to know things they should not have to know.
#
# The Windows and Linux downloads carry `-beta` in the name. Card writing works on all
# three, but only macOS has produced a card that went on to boot a board.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a dry run, any string)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple silicon)
            artifact: riparr-preparer-macos
          - os: windows-latest
            label: Windows (x64)
            artifact: riparr-preparer-windows-beta
            # One file, so what lands in Downloads is the program itself rather than a
            # folder of DLLs with an .exe somewhere inside it. It costs a second or two
            # of start-up while PyInstaller unpacks, which is a fair trade for something
            # run once per card.
            onefile: "--onefile"
          - os: ubuntu-latest
            label: Linux (x64)
            artifact: riparr-preparer-linux-beta

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # WebKitGTK is the web view pywebview uses on Linux, and PyGObject is how Python
      # reaches it. Neither is a pip package on this runner.
      - name: Linux web view
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/preparer/requirements.txt
          pip install pyinstaller

      - name: Build
        shell: bash
        run: |
          cd tools/preparer
          # --add-data puts ui/ (html, css, js, fonts, the mark) inside the bundle;
          # shell.py resolves it relative to __file__, which PyInstaller points at the
          # unpacked directory at runtime.
          # --collect-all webview: pywebview loads its per-platform backend by name at
          # runtime, so static analysis does not find it and the bundle starts, opens
          # nothing, and exits 0.
          pyinstaller --noconfirm --clean --windowed --name "Riparr Preparer" \
            ${ONEFILE} \
            --collect-all webview \
            --add-data "ui${PATHSEP:-:}ui" \
            --add-data "hostos${PATHSEP:-:}hostos" \
            shell.py
        env:
          PATHSEP: ${{ runner.os == 'Windows' && ';' || ':' }}
          ONEFILE: ${{ matrix.onefile }}

      # A .dmg with an Applications symlink in it, which is the gesture every Mac user
      # already knows. UDZO compresses it; -ov because a re-run must not stop to ask.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd tools/preparer/dist
          mkdir -p dmg
          cp -R "Riparr Preparer.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Riparr Preparer" -srcfolder dmg \
            -ov -format UDZO "$GITHUB_WORKSPACE/riparr-preparer-macos.dmg"

      # --onefile already produced exactly one file. Renaming it is the whole job.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item "tools/preparer/dist/Riparr Preparer.exe" `
            "riparr-preparer-windows-beta.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd tools/preparer/dist
          tar czf ../../../riparr-preparer-linux-beta.tar.gz "Riparr Preparer"

      - name: Smoke test
        shell: bash
        continue-on-error: true
        run: |
          # Not a launch -- there is no display on any of these runners. This only
          # proves the modules that decide *what the app can do* import and answer,
          # which is the half that has broken before.
          cd tools/preparer
          python -c "
          import sys; sys.path.insert(0, '.')
          import core, boards
          caps = core.host_capabilities()
          print('host:', caps['name'], 'write_card:', caps['write_card'])
          assert caps['setup'] is True
          assert boards.all_boards(), 'no boards'
          print('boards:', len(boards.all_boards()))
          "

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            riparr-preparer-*.dmg
            riparr-preparer-*.exe
            riparr-preparer-*.tar.gz
          if-no-files-found: error

  # The appliance payload. The box updates itself by downloading this, verifying it
  # against SHA256SUMS.txt, unpacking it over /opt/riparr and restarting -- so what is
  # in here has to be exactly what `tools/install.sh` puts there on a fresh install:
  # the working tree, minus the things that are built on the box rather than shipped to
  # it. `server/riparr/updater.py` refuses any archive without server/riparr/main.py in
  # it, which is the check that would have caught this being wrong.
  appliance:
    name: Appliance payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Three places have to agree or self-update silently stops working: the tag, the
      # appliance version and the Preparer version. A mismatch is a release that tells
      # every installed copy it is already current.
      - name: Versions agree with the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRV=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server/riparr/__init__.py)
          PRE=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' tools/preparer/bridge.py)
          echo "tag=$TAG appliance=$SRV preparer=$PRE"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "$TAG" = "$SRV" ] || { echo "::error::appliance version $SRV != tag $TAG"; exit 1; }
            [ "$TAG" = "$PRE" ] || { echo "::error::preparer version $PRE != tag $TAG"; exit 1; }
          fi
          [ "$SRV" = "$PRE" ] || { echo "::error::appliance $SRV != preparer $PRE"; exit 1; }

      - name: Build riparr-server.tar.gz
        run: |
          mkdir -p stage/riparr
          tar -cf - \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./.venv \
            --exclude=__pycache__ \
            --exclude='*.pyc' \
            --exclude=./stage \
            . | tar -xf - -C stage/riparr
          # The updater looks for this exact file before it will swap anything.
          test -f stage/riparr/server/riparr/main.py
          tar czf riparr-server.tar.gz -C stage riparr
          ls -lh riparr-server.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: riparr-server
          path: riparr-server.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: [build, appliance]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Riparr ${{ github.ref_name }}

            **Download the Preparer for your computer**, then follow
            [the guide](docs/guide/README.md).

            | | | |
            |---|---|---|
            | macOS | `riparr-preparer-macos.dmg` | Open it, drag Riparr Preparer to Applications |
            | Windows | `riparr-preparer-windows-beta.exe` | Double-click it |
            | Linux | `riparr-preparer-linux-beta.tar.gz` | Unpack and run `Riparr Preparer` |

            Writing an SD card works on all three. The Windows and Linux downloads say
            **beta** in the name: same code, and the card is verified as it is written
            and read back and compared before it is called done — but nobody has yet
            confirmed a card written on those two that went on to boot a board. If you
            do, [say so](../../issues); that is what takes them off beta.

            None of these are code-signed, so both macOS and Windows will warn you the
            first time. On macOS, right-click the app and choose Open. On Windows,
            More info → Run anyway.

            `riparr-server.tar.gz` is the appliance itself. You do not need to
            download it — a running Riparr fetches it, checks it against the
            checksums below, installs it and restarts itself from **System →
            Updates**.

            Checksums are in `SHA256SUMS.txt`.
