# Build the Preparer for macOS, Windows and Linux, and attach the three to a release.
#
# The Preparer is the only piece a person runs on their own computer; the appliance half
# installs itself onto the board. So "an app for every operating system" means this app,
# and the point of building it here rather than asking people to install Python is that
# nobody should need a toolchain to write an SD card.
#
# Each build is packaged the way its own platform expects a program to arrive: a .dmg
# you drag into Applications, a single .exe you double-click, a .tar.gz you unpack.
# Handing somebody a zip of a directory and calling it an app is how this used to work
# and it asked them to know things they should not have to know.
#
# The Windows and Linux downloads carry `-beta` in the name. Card writing works on all
# three, but only macOS has produced a card that went on to boot a board.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a dry run, any string)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple silicon)
            artifact: riparr-preparer-macos
          - os: windows-latest
            label: Windows (x64)
            artifact: riparr-preparer-windows-beta
            # One file, so what lands in Downloads is the program itself rather than a
            # folder of DLLs with an .exe somewhere inside it. It costs a second or two
            # of start-up while PyInstaller unpacks, which is a fair trade for something
            # run once per card.
            onefile: "--onefile"
          - os: ubuntu-latest
            label: Linux (x64)
            artifact: riparr-preparer-linux-beta

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # WebKitGTK is the web view pywebview uses on Linux, and PyGObject is how Python
      # reaches it. Neither is a pip package on this runner.
      - name: Linux web view
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/preparer/requirements.txt
          pip install pyinstaller

      # Gather the appliance next to the app before building, so --add-data names one
      # local directory on every platform. Reaching up out of the build directory with
      # "../../server" worked on macOS and Linux and collected nothing on Windows, and
      # the difference is not worth understanding when it can be removed instead.
      - name: Stage the appliance into the bundle
        shell: bash
        run: |
          set -e
          rm -rf tools/preparer/payload
          mkdir -p tools/preparer/payload/tools
          cp -R server tools/preparer/payload/server
          cp -R packaging tools/preparer/payload/packaging
          cp tools/install.sh tools/makemkv-install.sh tools/preparer/payload/tools/
          rm -rf tools/preparer/payload/server/.venv
          find tools/preparer/payload -name "__pycache__" -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find tools/preparer/payload -name "*.pyc" -delete 2>/dev/null || true
          echo "staged:"
          for f in server/riparr/main.py server/requirements.txt \
                   tools/install.sh packaging/riparr.service; do
            test -f "tools/preparer/payload/$f" || { echo "::error::did not stage $f"; exit 1; }
            echo "  ok  $f"
          done

      # The app shipped with PyInstaller's stock icon because --icon was never passed,
      # so the product mark that every other surface uses was missing from the one place
      # people actually look at it: the Dock, the disk image, Get Info.
      - name: Application icon
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then
            bash packaging/dmg/make-icns.sh server/static/img/riparr-512.png \
                 tools/preparer/riparr.icns
          else
            python -m pip install --quiet pillow
            python - <<'PY'
          from PIL import Image
          src = Image.open("server/static/img/riparr-512.png").convert("RGBA")
          # Every size Windows asks for; leaving one out makes Explorer upscale a
          # neighbour and it shows at 16px in the title bar.
          src.save("tools/preparer/riparr.ico",
                   sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64),
                          (128, 128), (256, 256)])
          print("wrote tools/preparer/riparr.ico")
          PY
          fi

      - name: Build
        shell: bash
        run: |
          cd tools/preparer
          ICON="riparr.icns"; [ "$RUNNER_OS" = "Windows" ] && ICON="riparr.ico"
          [ "$RUNNER_OS" = "Linux" ] && ICON=""
          [ -n "$ICON" ] && ICON_ARG="--icon $ICON" || ICON_ARG=""
          # --add-data puts ui/ (html, css, js, fonts, the mark) inside the bundle;
          # shell.py resolves it relative to __file__, which PyInstaller points at the
          # unpacked directory at runtime.
          # --collect-all webview: pywebview loads its per-platform backend by name at
          # runtime, so static analysis does not find it and the bundle starts, opens
          # nothing, and exits 0.
          # payload/ is the appliance itself, carried inside the app. Stage 2 streams
          # this tree to the box over SSH and runs tools/install.sh inside it, so a
          # bundle without it is a Preparer that writes a card and can then install
          # nothing -- which is precisely what v0.1.2 shipped.
          pyinstaller --noconfirm --clean --windowed --name "Riparr Preparer" \
            ${ONEFILE} \
            ${ICON_ARG} \
            --osx-bundle-identifier com.jackharvest.riparr-preparer \
            --collect-all webview \
            --collect-data certifi \
            --add-data "ui${PATHSEP:-:}ui" \
            --add-data "hostos${PATHSEP:-:}hostos" \
            --add-data "payload${PATHSEP:-:}payload" \
            shell.py
        env:
          PATHSEP: ${{ runner.os == 'Windows' && ';' || ':' }}
          ONEFILE: ${{ matrix.onefile }}

      # The build cannot be trusted to have carried the appliance with it. v0.1.2 was
      # packaged, signed, published and downloaded before anyone noticed that stage 2
      # had nothing to install -- so the presence of the payload is now a release gate
      # rather than something to discover on somebody else's Mac.
      # Written in Python, not shell. The shell version spent four release cycles
      # disagreeing with its own diagnostics: the TOC is a Python repr full of escaped
      # backslashes, and normalising that through tr and matching it through grep was
      # three layers of quoting to get wrong at once. Python reads the file and does a
      # substring test.
      - name: The bundle carries the appliance it installs
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, sys

          NEED = ["server/riparr/main.py", "server/requirements.txt",
                  "tools/install.sh", "packaging/riparr.service"]

          # One-directory build: the files are on disk, so look at them.
          dirs = [d for d in glob.glob("tools/preparer/dist/**/payload", recursive=True)
                  if os.path.isdir(d)]
          if dirs:
              root = dirs[0]
              print("checking the unpacked bundle at", root)
              missing = [f for f in NEED if not os.path.isfile(os.path.join(root, *f.split("/")))]
          else:
              # One-file build: --add-data lives inside the .exe and is unpacked to
              # _MEIPASS at runtime, so nothing is on disk. PyInstaller's own table of
              # contents is the record of what it collected.
              tocs = glob.glob("tools/preparer/build/**/*.toc", recursive=True)
              if not tocs:
                  print("::error::no PyInstaller TOC to check")
                  sys.exit(1)
              print("one-file build: checking", len(tocs), "TOC files")
              blob = ""
              for t in tocs:
                  with open(t, encoding="utf-8", errors="replace") as fh:
                      blob += fh.read()
              # In the repr a Windows separator is written as two characters.
              blob = blob.replace("\\\\", "/").replace("\\", "/")
              missing = [f for f in NEED if ("payload/" + f) not in blob]

          for f in NEED:
              print(("::error::payload is missing " if f in missing else "ok  ") + f)
          sys.exit(1 if missing else 0)
          PY

      # Card writing from the packaged app is a different code path from card writing in
      # a checkout, and the packaged one had never worked on any platform. A frozen build
      # is not a Python interpreter -- `sys.executable` is the application -- so handing
      # it `writer.py` re-entered the GUI's own argument parser and died with
      # "unrecognized arguments", which the interface reported as "Could not get
      # permission to write the card". writer.py was not collected into the bundle to be
      # run either way.
      #
      # `--write-card --help` can only print the writer's usage if shell.py's dispatch
      # reached writer.main(), so this proves the whole seam from the outside.
      - name: The bundle can reach its card writer
        shell: bash
        run: |
          set -e
          case "$RUNNER_OS" in
            macOS)   APP="tools/preparer/dist/Riparr Preparer.app/Contents/MacOS/Riparr Preparer" ;;
            Windows) APP="tools/preparer/dist/Riparr Preparer.exe" ;;
            *)       APP="tools/preparer/dist/Riparr Preparer/Riparr Preparer" ;;
          esac
          OUT=$("$APP" --write-card --help 2>&1) || true
          echo "$OUT"
          for f in --dev --progress --makemkv; do
            echo "$OUT" | grep -q -- "$f" || {
              echo "::error::--write-card never reached the writer (no $f in its usage)"
              exit 1
            }
          done
          echo "ok  --write-card reaches the writer"

      # The Wi-Fi screen exists to tell 2.4 GHz from 5 GHz and cannot do it without these
      # two. They were missing from requirements.txt, so they were never installed on the
      # runner and never collected -- and the failure is silent in the worst way:
      # `import CoreLocation` raises inside a function, the status comes back
      # "unavailable", and the interface reads that as "this platform has no such thing"
      # and hides the permission button *and* the note explaining its absence. Every
      # network read "band unknown" with nothing on screen to do about it.
      - name: The bundle carries CoreWLAN and CoreLocation (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          APP="tools/preparer/dist/Riparr Preparer.app"
          for m in CoreWLAN CoreLocation; do
            hit=$(find "$APP" \( -name "$m" -o -name "$m.so" \) -print -quit)
            [ -n "$hit" ] || {
              echo "::error::$m is not in the bundle; the Wi-Fi screen cannot show bands"
              exit 1
            }
            echo "ok  $m at $hit"
          done

      # A build with no CA certificates cannot download an operating system, check for
      # an update, or verify a checksum -- it fails every HTTPS call with
      # CERTIFICATE_VERIFY_FAILED. v0.1.4 shipped that way, and it is invisible from a
      # checkout because the system Python has a trust store the bundle does not.
      - name: The bundle carries CA certificates
        shell: bash
        run: |
          set -e
          hit=$(find tools/preparer/dist tools/preparer/build -name "cacert.pem" -print -quit || true)
          if [ -z "$hit" ]; then
            hit=$(find tools/preparer/build -name "*.toc" -exec grep -l "certifi" {} + 2>/dev/null | head -1 || true)
            [ -n "$hit" ] || { echo "::error::no certifi CA bundle in the build"; exit 1; }
            echo "ok  certifi collected (in TOC: $hit)"
          else
            echo "ok  cacert.pem at $hit"
          fi

      # PyInstaller's command line cannot set CFBundleShortVersionString, so the bundle
      # reported 0.0.0 in Get Info and in the version picker of anything that reads it.
      # The tag is the truth; write it in.
      - name: Stamp the version into the app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          [ -n "$V" ] || V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' tools/preparer/bridge.py)
          PL="tools/preparer/dist/Riparr Preparer.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$PL" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $V" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" "$PL" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $V" "$PL"
          # macOS will not even show the Location Services prompt without a usage
          # description, and requestWhenInUseAuthorization() then does nothing at all --
          # so the "Show bands and signal" button would be a button that never worked.
          # This string is what the user reads in the prompt.
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription \
            'Riparr uses your location only to let macOS reveal the names, bands and signal strength of nearby Wi-Fi networks, so it can tell you which ones the box can join. Nothing is stored or sent.'" "$PL" \
            || /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string \
            'Riparr uses your location only to let macOS reveal the names, bands and signal strength of nearby Wi-Fi networks, so it can tell you which ones the box can join. Nothing is stored or sent.'" "$PL"
          echo "stamped $V"
          plutil -p "$PL" | grep -iE "CFBundle|NSLocation"

      # Editing Info.plist breaks the seal PyInstaller's ad-hoc signature put on the
      # bundle, and on Apple silicon a broken signature is not "unidentified developer",
      # it is "damaged and can't be opened -- move it to the Trash". v0.1.3 shipped
      # exactly that, because the stamping step above was added without this one.
      - name: Re-sign after editing the bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          APP="tools/preparer/dist/Riparr Preparer.app"
          codesign --force --deep --sign - "$APP"
          echo "re-signed ad-hoc"

      # An unsigned app is a dialog the user can click through. An invalidly signed one
      # is a dead end, so validity is a release gate now rather than a thing discovered
      # by the person who downloaded it.
      # A permission the app cannot ask for is a feature that silently does nothing.
      - name: The bundle can ask for Location Services (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          PL="tools/preparer/dist/Riparr Preparer.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PL" >/dev/null \
            || { echo "::error::no NSLocationWhenInUseUsageDescription; the Wi-Fi band prompt cannot appear"; exit 1; }
          echo "ok  usage description present"

      - name: The signature is valid (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          APP="tools/preparer/dist/Riparr Preparer.app"
          codesign --verify --deep --strict "$APP"
          echo "signature verifies"

      # A .dmg with an Applications symlink in it, which is the gesture every Mac user
      # already knows. UDZO compresses it; -ov because a re-run must not stop to ask.
      # dmgbuild, not hdiutil and not create-dmg. hdiutil produced the white box with two
      # icons that this used to ship. create-dmg drives Finder over AppleScript to set the
      # icon view, and on a real Mac it silently wrote backgroundType 0 and iconSize 48 --
      # the same white box -- which a headless runner is not going to do better. dmgbuild
      # writes the .DS_Store itself, so the window looks the same everywhere and does not
      # depend on a Finder session co-operating.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          python -m pip install --quiet dmgbuild
          cp tools/preparer/riparr.icns packaging/dmg/riparr.icns
          RIPARR_APP="$PWD/tools/preparer/dist/Riparr Preparer.app" \
          RIPARR_DMG_DIR="$PWD/packaging/dmg" \
            dmgbuild -s packaging/dmg/settings.py "Riparr Preparer" \
              "$GITHUB_WORKSPACE/riparr-preparer-macos.dmg"

      # The window settings are the whole point of the step above, and they are invisible
      # until somebody opens the image. Read them back instead.
      - name: The disk image is styled (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          python -m pip install --quiet ds_store
          MNT=$(mktemp -d)
          hdiutil attach "$GITHUB_WORKSPACE/riparr-preparer-macos.dmg" \
            -nobrowse -readonly -mountpoint "$MNT" -quiet
          python - "$MNT" <<'PY'
          import sys
          from ds_store import DSStore
          mnt = sys.argv[1]
          want = {"backgroundType": 2, "iconSize": 128.0}
          bad = []
          with DSStore.open(mnt + "/.DS_Store", "r") as d:
              seen = {}
              for e in d:
                  if e.code == b"icvp":
                      v = e.value
                      for k, exp in want.items():
                          if v.get(k) != exp:
                              bad.append("%s is %r, wanted %r" % (k, v.get(k), exp))
                      if not v.get("backgroundImageAlias"):
                          bad.append("no background image")
                  elif e.code == b"Iloc":
                      seen[e.filename] = e.value
          for n in ("Riparr Preparer.app", "Applications"):
              if n not in seen:
                  bad.append("no icon position for " + n)
          for b in bad:
              print("::error::disk image styling: " + b)
          print("icon positions:", seen)
          sys.exit(1 if bad else 0)
          PY
          rc=$?
          hdiutil detach "$MNT" -quiet || true
          exit $rc

      # --onefile already produced exactly one file. Renaming it is the whole job.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item "tools/preparer/dist/Riparr Preparer.exe" `
            "riparr-preparer-windows-beta.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd tools/preparer/dist
          tar czf ../../../riparr-preparer-linux-beta.tar.gz "Riparr Preparer"

      - name: Smoke test
        shell: bash
        continue-on-error: true
        run: |
          # Not a launch -- there is no display on any of these runners. This only
          # proves the modules that decide *what the app can do* import and answer,
          # which is the half that has broken before.
          cd tools/preparer
          python -c "
          import sys; sys.path.insert(0, '.')
          import core, boards
          caps = core.host_capabilities()
          print('host:', caps['name'], 'write_card:', caps['write_card'])
          assert caps['setup'] is True
          assert boards.all_boards(), 'no boards'
          print('boards:', len(boards.all_boards()))
          "

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            riparr-preparer-*.dmg
            riparr-preparer-*.exe
            riparr-preparer-*.tar.gz
          if-no-files-found: error

  # The appliance payload. The box updates itself by downloading this, verifying it
  # against SHA256SUMS.txt, unpacking it over /opt/riparr and restarting -- so what is
  # in here has to be exactly what `tools/install.sh` puts there on a fresh install:
  # the working tree, minus the things that are built on the box rather than shipped to
  # it. `server/riparr/updater.py` refuses any archive without server/riparr/main.py in
  # it, which is the check that would have caught this being wrong.
  appliance:
    name: Appliance payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Three places have to agree or self-update silently stops working: the tag, the
      # appliance version and the Preparer version. A mismatch is a release that tells
      # every installed copy it is already current.
      - name: Versions agree with the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRV=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server/riparr/__init__.py)
          PRE=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' tools/preparer/bridge.py)
          echo "tag=$TAG appliance=$SRV preparer=$PRE"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "$TAG" = "$SRV" ] || { echo "::error::appliance version $SRV != tag $TAG"; exit 1; }
            [ "$TAG" = "$PRE" ] || { echo "::error::preparer version $PRE != tag $TAG"; exit 1; }
          fi
          [ "$SRV" = "$PRE" ] || { echo "::error::appliance $SRV != preparer $PRE"; exit 1; }

      - name: Build riparr-server.tar.gz
        run: |
          mkdir -p stage/riparr
          tar -cf - \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./.venv \
            --exclude=__pycache__ \
            --exclude='*.pyc' \
            --exclude=./stage \
            . | tar -xf - -C stage/riparr
          # The updater looks for this exact file before it will swap anything.
          test -f stage/riparr/server/riparr/main.py
          tar czf riparr-server.tar.gz -C stage riparr
          ls -lh riparr-server.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: riparr-server
          path: riparr-server.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: [build, appliance]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Riparr ${{ github.ref_name }}

            **Download the Preparer for your computer**, then follow
            [the guide](docs/guide/README.md).

            | | | |
            |---|---|---|
            | macOS | `riparr-preparer-macos.dmg` | Open it, drag Riparr Preparer to Applications |
            | Windows | `riparr-preparer-windows-beta.exe` | Double-click it |
            | Linux | `riparr-preparer-linux-beta.tar.gz` | Unpack and run `Riparr Preparer` |

            Writing an SD card works on all three. The Windows and Linux downloads say
            **beta** in the name: same code, and the card is verified as it is written
            and read back and compared before it is called done — but nobody has yet
            confirmed a card written on those two that went on to boot a board. If you
            do, [say so](../../issues); that is what takes them off beta.

            None of these are code-signed, so both macOS and Windows will warn you the
            first time. On macOS, right-click the app and choose Open. On Windows,
            More info → Run anyway.

            `riparr-server.tar.gz` is the appliance itself. You do not need to
            download it — a running Riparr fetches it, checks it against the
            checksums below, installs it and restarts itself from **System →
            Updates**.

            Checksums are in `SHA256SUMS.txt`.
