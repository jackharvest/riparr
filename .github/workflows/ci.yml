# The cheap checks, on every push.
#
# There is no test suite yet and this does not pretend there is one. What it does is
# catch the three ways this repository has actually broken: a Python file that no longer
# parses, a JavaScript file with an unbalanced template literal (the whole interface is
# template literals, and one bad backtick blanks every page), and a shell script with a
# syntax error — which for the installer means a box that will not install.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Python parses
        run: |
          python -m compileall -q server/riparr tools/preparer tools/flasher

      - name: JavaScript parses
        run: |
          for f in server/static/app.js server/static/icons.js \
                   tools/preparer/ui/app.js tools/preparer/ui/bridge-shim.js; do
            node --check "$f" && echo "ok  $f"
          done

      # The bridge shim has shipped broken twice, in opposite directions, and neither
      # failure is visible by reading it -- both depend on when pywebview attaches its
      # api relative to when the script runs. This asserts both timings.
      - name: The bridge shim survives every bridge timing
        run: |
          node tools/preparer/ui/bridge-shim.test.js

      # The interface is one HTML file edited by hand and by script. A stray unbalanced
      # div silently swallows a screen's footer, which is how the Review buttons ended
      # up off the bottom of the window.
      - name: The interface markup is balanced
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          import sys
          VOID = {"area","base","br","col","embed","hr","img","input","link","meta",
                  "source","track","wbr"}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.err=[]
              def handle_starttag(self, t, a):
                  if t not in VOID: self.stack.append((t, self.getpos()[0]))
              def handle_endtag(self, t):
                  if t in VOID: return
                  if self.stack and self.stack[-1][0] == t: self.stack.pop()
                  else: self.err.append("line %d: stray </%s>" % (self.getpos()[0], t))
          for f in ("tools/preparer/ui/index.html", "server/static/index.html"):
              p = P(); p.feed(open(f).read())
              bad = p.err + ["line %d: <%s> never closed" % (l, t) for t, l in p.stack]
              for b in bad:
                  print("::error::%s: %s" % (f, b))
              if bad:
                  sys.exit(1)
              print("ok  %s" % f)
          PY

      - name: Shell parses
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" && echo "ok  $f"
          done

      - name: systemd units are well formed
        run: |
          # No systemd-analyze on the runner for a unit that names paths which do not
          # exist here, so this is the shape check: every unit has a [Unit] section and
          # every .path has a [Path] with something to watch.
          fail=0
          for f in $(git ls-files 'packaging/*.service' 'packaging/*.path'); do
            grep -q '^\[Unit\]' "$f" || { echo "no [Unit] in $f"; fail=1; }
            case "$f" in
              *.path) grep -qE '^Path(Exists|Changed|Modified|ExistsGlob)=' "$f" \
                        || { echo "no Path*= in $f"; fail=1; } ;;
              *.service) grep -q '^\[Service\]' "$f" \
                        || { echo "no [Service] in $f"; fail=1; } ;;
            esac
            echo "ok  $f"
          done
          exit $fail

      - name: The MakeMKV manifest is readable and pinned
        run: |
          python - <<'PY'
          import json
          m = json.load(open("packaging/makemkv-manifest.json"))
          assert m["packages"], "no packages"
          for p in m["packages"]:
              assert len(p["sha256"]) == 64, p["name"]
              assert p["urls"], p["name"]
              print(p["name"], len(p["urls"]), "sources")
          PY

      - name: The service starts and answers
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r server/requirements.txt
          cd server
          RIPARR_DB=/tmp/ci.db /tmp/venv/bin/python -m uvicorn riparr.main:app \
            --host 127.0.0.1 --port 9797 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9797/api/status >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9797/api/status | head -c 200; echo
          curl -fsS http://127.0.0.1:9797/api/setup/state
