# The cheap checks, on every push.
#
# There is no test suite yet and this does not pretend there is one. What it does is
# catch the three ways this repository has actually broken: a Python file that no longer
# parses, a JavaScript file with an unbalanced template literal (the whole interface is
# template literals, and one bad backtick blanks every page), and a shell script with a
# syntax error — which for the installer means a box that will not install.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Python parses
        run: |
          python -m compileall -q server/riparr tools/preparer tools/flasher

      # Parsing proves a file is syntactically Python. It does not prove the names in it
      # exist, and the gap between those two swallowed the entire self-update feature:
      # `_quit_soon` called `time.sleep` in a module that never imported `time`, so its
      # thread raised NameError on the first line and neither the quit nor the exit that
      # followed it ever ran. Every release from v0.1.5 to v0.1.11 shipped that way. A
      # windowed build has no stderr for a traceback to land in, so what it looked like
      # from outside was an app frozen on "Restarting" -- and two fixes were written for
      # that stall, both editing lines below the one that always raised.
      #
      # pyflakes finds it in milliseconds. Only undefined names fail the build; the rest
      # of what it reports is worth reading and is not worth failing a release over.
      - name: Python names exist
        run: |
          pip install -q pyflakes
          pyflakes server/riparr tools/preparer tools/flasher > flakes.txt || true
          grep "undefined name" flakes.txt \
            | grep -v "unable to detect undefined names" > undefined.txt || true
          if [ -s undefined.txt ]; then
            sed 's/^/::error::/' undefined.txt
            exit 1
          fi
          echo "ok  every name resolves"
          echo "--- pyflakes also noticed (not fatal) ---"
          cat flakes.txt

      # `hostos` is a facade over four backends, and a function implemented in one of them
      # but not re-exported here does not exist as far as any caller is concerned. That is
      # not a hypothetical: `location_status` and `request_location` lived in darwin.py
      # from the day they were written and were never listed in __init__.py, so core.py's
      # `getattr(hostos, ..., None)` found nothing, concluded macOS does not gate Wi-Fi
      # scans on a location permission, and hid the button that asks for one. Wi-Fi band
      # detection was dead in every release, and the omission is invisible from both sides
      # -- the backend has the function, the caller has a fallback.
      #
      # Parsed rather than imported: windows.py cannot be imported on this runner, and the
      # question is about what each file defines, not about what runs.
      - name: hostos exports its whole contract
        run: |
          python - <<'PY'
          import ast, sys

          REQUIRED = [
              "NAME", "CAN_WRITE", "UPDATE_SUFFIX",
              "list_block_devices", "scan_wifi", "saved_network_password",
              "location_status", "request_location",
              "open_url", "reveal", "keep_awake_command",
              "valid_device_id", "block_device", "raw_device", "partition_devices",
              "unmount_disk", "probe_writable", "open_sink", "open_reader", "flush",
              "rescan_partitions", "mount_boot", "eject", "explain_write_error",
              "elevate", "update_target", "swap_and_relaunch",
          ]

          def defined(path):
              names = set()
              for node in ast.parse(open(path).read()).body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      names.add(node.name)
                  elif isinstance(node, ast.Assign):
                      names |= {t.id for t in node.targets if isinstance(t, ast.Name)}
              return names

          bad = False
          facade = defined("tools/preparer/hostos/__init__.py")
          for n in REQUIRED:
              if n not in facade:
                  print("::error::hostos/__init__.py does not re-export %s" % n)
                  bad = True
          print("ok  facade re-exports %d names" % len(REQUIRED) if not bad else "facade INCOMPLETE")

          for mod in ("darwin", "linux", "windows", "unsupported"):
              have = defined("tools/preparer/hostos/%s.py" % mod)
              gaps = [n for n in REQUIRED if n not in have]
              for n in gaps:
                  print("::error::hostos/%s.py does not implement %s" % (mod, n))
              print(("ok  " if not gaps else "BAD ") + mod)
              bad = bad or bool(gaps)

          sys.exit(1 if bad else 0)
          PY

      - name: JavaScript parses
        run: |
          for f in server/static/app.js server/static/icons.js \
                   tools/preparer/ui/app.js tools/preparer/ui/bridge-shim.js; do
            node --check "$f" && echo "ok  $f"
          done

      # The bridge shim has shipped broken twice, in opposite directions, and neither
      # failure is visible by reading it -- both depend on when pywebview attaches its
      # api relative to when the script runs. This asserts both timings.
      - name: The bridge shim survives every bridge timing
        run: |
          node tools/preparer/ui/bridge-shim.test.js

      # The interface is one HTML file edited by hand and by script. A stray unbalanced
      # div silently swallows a screen's footer, which is how the Review buttons ended
      # up off the bottom of the window.
      - name: The interface markup is balanced
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          import sys
          VOID = {"area","base","br","col","embed","hr","img","input","link","meta",
                  "source","track","wbr"}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.err=[]
              def handle_starttag(self, t, a):
                  if t not in VOID: self.stack.append((t, self.getpos()[0]))
              def handle_endtag(self, t):
                  if t in VOID: return
                  if self.stack and self.stack[-1][0] == t: self.stack.pop()
                  else: self.err.append("line %d: stray </%s>" % (self.getpos()[0], t))
          for f in ("tools/preparer/ui/index.html", "server/static/index.html"):
              p = P(); p.feed(open(f).read())
              bad = p.err + ["line %d: <%s> never closed" % (l, t) for t, l in p.stack]
              for b in bad:
                  print("::error::%s: %s" % (f, b))
              if bad:
                  sys.exit(1)
              print("ok  %s" % f)
          PY

      # The update swap, against the failure that ate a live box's virtualenv.
      #
      # v0.1.18 moved /opt/riparr aside to put the new version in its place. The service
      # runs as `riparr` and /opt is root-owned, so that raised PermissionError every
      # time -- appliance self-update had never once worked. And it carried the venv into
      # a temp directory *before* that step, which the `finally` then deleted: a failed
      # update reported "Nothing was changed" while removing the interpreter the service
      # is defined to run. The box kept serving from open file handles and would not have
      # survived its next restart.
      #
      # Run against that version this fails on "THE VIRTUALENV SURVIVED".
      - name: The update swap keeps the virtualenv
        run: |
          python server/updater-swap.test.py

      # A 3D Blu-ray's two cuts are the same film at the same length, so longest-wins
      # picks the 3D one -- twice the size, and most players will not use it. The first
      # fix for that took the smallest title of any runtime tie, which on an obfuscated
      # disc means picking a decoy playlist over the film. Both regressions are in here.
      - name: The right title comes off the disc
        run: |
          python server/choose-title.test.py

      - name: Shell parses
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" && echo "ok  $f"
          done

      - name: systemd units are well formed
        run: |
          # No systemd-analyze on the runner for a unit that names paths which do not
          # exist here, so this is the shape check: every unit has a [Unit] section and
          # every .path has a [Path] with something to watch.
          fail=0
          for f in $(git ls-files 'packaging/*.service' 'packaging/*.path'); do
            grep -q '^\[Unit\]' "$f" || { echo "no [Unit] in $f"; fail=1; }
            case "$f" in
              *.path) grep -qE '^Path(Exists|Changed|Modified|ExistsGlob)=' "$f" \
                        || { echo "no Path*= in $f"; fail=1; } ;;
              *.service) grep -q '^\[Service\]' "$f" \
                        || { echo "no [Service] in $f"; fail=1; } ;;
            esac
            echo "ok  $f"
          done
          exit $fail

      - name: The MakeMKV manifest is readable and pinned
        run: |
          python - <<'PY'
          import json
          m = json.load(open("packaging/makemkv-manifest.json"))
          assert m["packages"], "no packages"
          for p in m["packages"]:
              assert len(p["sha256"]) == 64, p["name"]
              assert p["urls"], p["name"]
              print(p["name"], len(p["urls"]), "sources")
          PY

      - name: The service starts and answers
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r server/requirements.txt
          cd server
          RIPARR_DB=/tmp/ci.db /tmp/venv/bin/python -m uvicorn riparr.main:app \
            --host 127.0.0.1 --port 9797 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9797/api/status >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9797/api/status | head -c 200; echo
          curl -fsS http://127.0.0.1:9797/api/setup/state
