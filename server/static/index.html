<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riparr</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/riparr-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/riparr-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/riparr-180.png">
<meta name="theme-color" content="#241155">
<link rel="preload" href="/static/fonts/RussoOne-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" id="theme" href="/static/themes/servarr.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- ── sign in ───────────────────────────────────────────── -->
<div id="gate" class="gate hidden">
  <form class="gate-card" id="login-form">
    <img class="gate-mark" src="/static/img/riparr-mark.png" alt="">
    <h1>Riparr</h1>
    <p class="muted" id="gate-sub">Sign in to continue</p>
    <label class="f"><span>Username</span><input id="gate-user" autocomplete="username"></label>
    <label class="f"><span>Password</span><input id="gate-pass" type="password" autocomplete="current-password"></label>
    <div class="gate-err" id="gate-err"></div>
    <button class="btn primary wide" type="submit">Sign in</button>
  </form>

  <!-- Shown instead of the form while the service is still answering. Kept as a
       sibling rather than replacing the form's markup, so the submit handler bound
       at load time survives. -->
  <div class="gate-card hidden" id="gate-waiting">
    <img class="gate-mark" src="/static/img/riparr-mark.png" alt="">
    <h1>Riparr</h1>
    <div class="gate-wait">
      <div class="spin" id="gate-spin"></div>
      <p id="gate-wait-msg">Starting up…</p>
    </div>
    <button class="btn primary wide hidden" id="gate-retry" type="button">Try again</button>
  </div>
</div>

<!-- ── first run ─────────────────────────────────────────── -->
<div id="wizard" class="wizard hidden"></div>

<!-- ── main shell ────────────────────────────────────────── -->
<div id="shell" class="shell hidden">
  <header class="topbar">
    <button class="hamburger" id="hamburger" aria-label="Menu" data-ic="bars"></button>
    <a class="logo" href="#/queue"><img class="logo-mark" src="/static/img/riparr-mark.png" alt=""> <span class="logo-word">Riparr</span></a>
    <label class="search"><span class="mag" data-ic="magnifying-glass"></span>
      <input id="search" placeholder="Search" autocomplete="off"></label>
    <div class="grow"></div>
    <div class="pills" id="health-pills"></div>
    <!-- Riparr is free and forkable; this is the only ask on the page, and it sits
         next to the account menu rather than inside the interface proper. -->
    <a class="icon-btn coffee" href="https://buymeacoffee.com/jackharvest"
       target="_blank" rel="noopener noreferrer"
       title="Buy me a coffee" aria-label="Buy me a coffee" data-ic="mug-hot"></a>
    <div class="menu-wrap">
      <button class="icon-btn" id="user-btn" title="Account" data-ic="user"></button>
      <div class="menu hidden" id="user-menu">
        <div class="menu-head" id="menu-who">Signed in</div>
        <a href="#/system/status">System</a>
        <a href="#/settings/general">Change password</a>
        <a href="#" id="logout">Sign out</a>
        <!-- The box has no power button, so this is the only way to stop it safely.
             It belongs with the account, not on the Queue page beside a rip. -->
        <div class="menu-sep"></div>
        <div class="menu-label">Power</div>
        <a href="#" id="sys-reboot">Restart</a>
        <a href="#" id="sys-poweroff" class="danger">Shut down</a>
      </div>
    </div>
  </header>

  <nav class="sidebar" id="sidebar"></nav>

  <main class="content" id="content"></main>
</div>

<div class="toast-host" id="toasts"></div>
<script src="/static/icons.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
